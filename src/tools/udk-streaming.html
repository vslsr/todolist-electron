<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'" />
  <title>UDK Streaming 生成</title>
  <style>
    :root {
      --accent: #667eea;
      --bg: #f5f6fa;
      --card: #ffffff;
      --text: #2c2f3a;
      --muted: #8a90a6;
      --border: #e2e5f0;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
    }

    /* ── Toolbar ── */
    .toolbar {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px 12px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      background: var(--card);
      flex-shrink: 0;
    }
    .toolbar h1 { margin: 0 6px 0 0; font-size: 15px; font-weight: 700; white-space: nowrap; }
    .field { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--muted); }
    .field input {
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 5px 8px;
      font-size: 12px;
      color: var(--text);
      outline: none;
      font-family: inherit;
    }
    .field input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(102,126,234,.15); }
    .field input.wide  { width: 300px; }
    .field input.mid   { width: 160px; }
    .field input.short { width: 80px; }
    .spacer { flex: 1; }
    button {
      border: none; border-radius: 7px; padding: 7px 14px;
      font-size: 13px; font-family: inherit; cursor: pointer;
      transition: filter .15s, background .15s;
      white-space: nowrap;
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { filter: brightness(1.08); }
    .btn-ghost { background: #eef0f8; color: #4a4f70; }
    .btn-ghost:hover { background: #e2e5f3; }

    /* ── Body row ── */
    .body-row {
      flex: 1;
      display: flex;
      min-height: 0;
    }

    /* ── Left panel: file list ── */
    .left-panel {
      width: 300px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border);
      background: var(--card);
    }
    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 12px;
      font-size: 12px;
      font-weight: 600;
      color: #4a4f70;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .panel-count { color: var(--accent); font-weight: 700; }

    .file-list {
      flex: 1;
      overflow-y: auto;
      padding: 4px 0;
    }
    .file-item {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      font-size: 12px;
      font-family: Consolas, monospace;
      cursor: default;
      border-radius: 4px;
      margin: 1px 6px;
      transition: background .1s;
    }
    .file-item:hover { background: #eef0f8; }
    .file-item.matched { color: var(--text); }
    .file-item.unmatched { color: #bbb; }
    .file-item input[type=checkbox] { cursor: pointer; accent-color: var(--accent); flex-shrink: 0; }
    .file-item .fname { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .file-item .fname mark {
      background: #fff3b0; color: var(--text);
      border-radius: 2px; padding: 0 1px;
    }

    .list-empty {
      padding: 24px 16px;
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.8;
    }

    /* ── Right panel: output ── */
    .right-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    textarea {
      flex: 1; border: none; outline: none; resize: none; padding: 12px;
      font-family: Consolas, "Courier New", monospace; font-size: 12px; line-height: 1.6;
      color: var(--text); background: #fbfcff; white-space: pre; overflow: auto;
    }

    /* ── Status bar ── */
    .status {
      padding: 5px 14px; font-size: 12px; color: var(--muted);
      border-top: 1px solid var(--border); background: var(--card);
      flex-shrink: 0;
    }
    .status.err { color: #d14343; }
    .status.ok  { color: #2f9e5f; }
  </style>
</head>
<body>

  <div class="toolbar">
    <h1>📦 UDK Streaming 生成</h1>

    <label class="field">
      文件夹
      <input id="folder-path" class="wide" type="text" placeholder="点击浏览… 或直接粘贴路径" spellcheck="false" />
    </label>
    <button id="browse-btn" class="btn-ghost">浏览…</button>

    <label class="field">
      筛选正则
      <input id="filter-regex" class="mid" type="text" value="PBR_B" placeholder="如 PBR_B" spellcheck="false" />
    </label>

    <button id="scan-btn" class="btn-primary">扫描 →</button>

    <div class="spacer"></div>

    <button id="gen-btn" class="btn-primary">生成 T3D →</button>
    <button id="copy-btn" class="btn-ghost">复制结果</button>
    <button id="clear-btn" class="btn-ghost">清空</button>
  </div>

  <!-- second toolbar row: T3D config params -->
  <div class="toolbar" style="padding: 7px 14px; gap: 6px 10px; border-top: none;">
    <span style="font-size:12px;color:var(--muted);font-weight:600;">T3D 参数</span>

    <label class="field">
      对象名
      <input id="obj-name" class="mid" type="text" value="SeqAct_MultiLevelStreaming_0" spellcheck="false" />
    </label>

    <label class="field">
      ParentSequence
      <input id="parent-seq" class="mid" type="text" value="Main_Sequence" placeholder="Main_Sequence" spellcheck="false" />
    </label>

    <label class="field">
      ObjPosX
      <input id="pos-x" class="short" type="number" value="1336" />
    </label>
    <label class="field">
      ObjPosY
      <input id="pos-y" class="short" type="number" value="808" />
    </label>

    <label class="field" title="最多记录的 Level 索引数，用于 InputLinks DrawY 估算">
      DrawY 起始
      <input id="drawy-start" class="short" type="number" value="845" />
    </label>
  </div>

  <div class="body-row">
    <!-- Left: filtered file list with checkboxes -->
    <div class="left-panel">
      <div class="panel-head">
        <span>匹配文件</span>
        <span class="panel-count" id="match-count">—</span>
      </div>
      <div class="file-list" id="file-list">
        <div class="list-empty">先选择文件夹并扫描</div>
      </div>
    </div>

    <!-- Right: T3D output -->
    <div class="right-panel">
      <div class="panel-head" style="border-left: none;">
        <span>T3D 输出 (SeqAct_MultiLevelStreaming)</span>
        <span class="panel-count" id="out-count"></span>
      </div>
      <textarea id="output" spellcheck="false" readonly placeholder="点击"生成 T3D"后在此显示结果…"></textarea>
    </div>
  </div>

  <div id="status" class="status">输入文件夹路径并扫描，勾选要包含的关卡，再点击"生成 T3D"。</div>

  <script src="udk-streaming.js"></script>
</body>
</html>
