<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'" />
  <title>远程事件生成</title>
  <style>
    :root {
      --accent: #667eea;
      --bg: #f5f6fa;
      --card: #ffffff;
      --text: #2c2f3a;
      --muted: #8a90a6;
      --border: #e2e5f0;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
    }

    .toolbar {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px 12px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      background: var(--card);
    }
    .toolbar h1 { margin: 0 6px 0 0; font-size: 15px; font-weight: 700; }
    .field { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--muted); }
    .field input {
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 5px 8px;
      font-size: 12px;
      color: var(--text);
      outline: none;
    }
    .field input:focus { border-color: var(--accent); }
    .field input.num { width: 58px; }
    .field input.wide { width: 280px; }
    .field input.mid { width: 150px; }
    .spacer { flex: 1; }

    button {
      border: none; border-radius: 7px; padding: 7px 15px;
      font-size: 13px; cursor: pointer; transition: filter .15s, background .15s;
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { filter: brightness(1.08); }
    .btn-ghost { background: #eef0f8; color: #4a4f70; }
    .btn-ghost:hover { background: #e2e5f3; }

    .panes {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1px;
      background: var(--border);
      min-height: 0;
    }
    .pane { display: flex; flex-direction: column; background: var(--card); min-height: 0; }
    .pane-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 7px 12px; font-size: 12px; font-weight: 600; color: #4a4f70;
      border-bottom: 1px solid var(--border);
    }
    .pane-count { color: var(--accent); font-weight: 700; }
    textarea {
      flex: 1; border: none; outline: none; resize: none; padding: 12px;
      font-family: Consolas, "Courier New", monospace; font-size: 12px; line-height: 1.5;
      color: var(--text); background: transparent; white-space: pre; overflow: auto;
    }
    #output { background: #fbfcff; }
    .status {
      padding: 6px 14px; font-size: 12px; color: var(--muted);
      border-top: 1px solid var(--border); background: var(--card);
    }
    .status.err { color: #d14343; }
    .status.ok { color: #2f9e5f; }
  </style>
</head>
<body>
  <div class="toolbar">
    <h1>📡 远程事件生成</h1>
    <label class="field" title="SeqAct_ActivateRemoteEvent 的起始编号">Activate 起始ID <input id="act-start" class="num" type="number" value="6" min="0" /></label>
    <label class="field" title="SeqEvent_RemoteEvent 的起始编号">Event 起始ID <input id="evt-start" class="num" type="number" value="2" min="0" /></label>
    <label class="field">ParentSequence <input id="parent-seq" class="mid" type="text" value="RoomATask1" /></label>
    <label class="field" title="Activate 对象的起始 X 坐标（Event 自动取 X-16）">起始X <input id="pos-x" class="num" type="number" value="-3312" /></label>
    <label class="field" title="Activate 对象的起始 Y 坐标（Event 自动取 Y-160）">起始Y <input id="pos-y" class="num" type="number" value="3984" /></label>
    <label class="field" title="批量生成时，相邻事件对之间的 Y 间距">垂直间距 <input id="gap" class="num" type="number" value="320" /></label>
    <label class="field" title="RemoteEvent 触发后连向的目标；留空则不连出">Event 输出目标 <input id="target" class="wide" type="text" value="SeqAct_SetPhysics'SeqAct_SetPhysics_0'" placeholder="留空则事件不连出" /></label>
    <div class="spacer"></div>
    <button id="gen-btn" class="btn-primary">生成 →</button>
    <button id="copy-btn" class="btn-ghost">复制结果</button>
    <button id="clear-btn" class="btn-ghost">清空</button>
  </div>

  <div class="panes">
    <div class="pane">
      <div class="pane-head">
        <span>输入（每行一个 EventName）</span>
        <span class="pane-count" id="in-count">0 个事件</span>
      </div>
      <textarea id="input" spellcheck="false" placeholder="每行一个 EventName，例如：&#10;RoomATeleportTask1"></textarea>
    </div>
    <div class="pane">
      <div class="pane-head">
        <span>输出（Activate + RemoteEvent）</span>
        <span class="pane-count" id="out-count"></span>
      </div>
      <textarea id="output" spellcheck="false" readonly placeholder="点击“生成”后在此显示结果…"></textarea>
    </div>
  </div>

  <div id="status" class="status">为每个 EventName 生成一对：SeqAct_ActivateRemoteEvent（发送）+ SeqEvent_RemoteEvent（接收）。</div>

  <script src="remote-event.js"></script>
</body>
</html>
