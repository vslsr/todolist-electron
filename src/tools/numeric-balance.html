<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Vue 全量版在运行时用 new Function 编译模板 => 需放开 'unsafe-eval'。
       本工具只加载本地 vendored 脚本(file://),无远程内容,风险可控。 -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'" />
  <title>数值平衡器</title>
  <style>
    :root {
      --accent: #667eea;
      --accent2: #764ba2;
      --bg: #f5f6fa;
      --card: #ffffff;
      --text: #2c2f3a;
      --muted: #8a90a6;
      --border: #e2e5f0;
      --soft: #eef0f8;
      --good: #2f9e5f;
      --warn: #e0902f;
      --bad: #d14343;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      font-size: 13px;
    }

    /* ── 顶栏 ───────────────────────────────────────── */
    .toolbar {
      display: flex; align-items: center; gap: 14px;
      padding: 10px 16px; border-bottom: 1px solid var(--border); background: var(--card);
      flex-shrink: 0;
    }
    .toolbar h1 { margin: 0; font-size: 15px; font-weight: 700; }
    .tabs { display: flex; gap: 6px; }
    .tab {
      border: none; border-radius: 8px; padding: 7px 16px; cursor: pointer;
      font-size: 13px; background: var(--soft); color: #4a4f70; transition: .15s;
    }
    .tab:hover { background: #e2e5f3; }
    .tab.active { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; }
    .spacer { flex: 1; }
    .link-btn {
      border: none; background: transparent; color: var(--muted);
      font-size: 12px; cursor: pointer; padding: 6px 8px; border-radius: 6px;
    }
    .link-btn:hover { background: var(--soft); color: var(--text); }

    /* ── 布局 ───────────────────────────────────────── */
    .content { flex: 1; overflow: auto; padding: 16px; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    @media (max-width: 900px) { .grid2 { grid-template-columns: 1fr; } }

    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      padding: 14px 16px; margin-bottom: 14px;
    }
    .card:last-child { margin-bottom: 0; }
    .card-head {
      display: flex; align-items: center; gap: 8px; margin-bottom: 12px;
    }
    .card-head h2 { margin: 0; font-size: 14px; font-weight: 700; }
    .card-head .hint { font-size: 11px; color: var(--muted); font-weight: 400; }
    .card-head .spacer { flex: 1; }

    /* ── 按钮 ───────────────────────────────────────── */
    button.btn {
      border: none; border-radius: 7px; padding: 6px 13px;
      font-size: 12px; cursor: pointer; transition: filter .15s, background .15s;
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { filter: brightness(1.08); }
    .btn-ghost { background: var(--soft); color: #4a4f70; }
    .btn-ghost:hover { background: #e2e5f3; }
    .btn-mini { padding: 3px 9px; font-size: 12px; border-radius: 6px; }

    /* ── 表单 ───────────────────────────────────────── */
    .field { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
    input[type="text"], input[type="number"], select {
      border: 1px solid var(--border); border-radius: 6px; padding: 5px 7px;
      font-size: 12px; color: var(--text); outline: none; background: #fff;
    }
    input:focus, select:focus { border-color: var(--accent); }
    .radios { display: flex; gap: 6px; flex-wrap: wrap; }
    .radio-chip {
      display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
      border: 1px solid var(--border); border-radius: 8px; padding: 6px 11px;
      font-size: 12px; background: #fff; transition: .15s;
    }
    .radio-chip.on { border-color: var(--accent); background: #f0f2ff; color: var(--accent); font-weight: 600; }
    .radio-chip input { display: none; }

    /* ── 单位表 ─────────────────────────────────────── */
    table.units { width: 100%; border-collapse: collapse; }
    table.units th {
      font-size: 11px; color: var(--muted); font-weight: 600; text-align: center;
      padding: 4px 3px; border-bottom: 1px solid var(--border); white-space: nowrap;
    }
    table.units td { padding: 4px 3px; text-align: center; }
    table.units input[type="text"] { width: 74px; text-align: left; }
    table.units input[type="number"] { width: 58px; text-align: right; }
    .swatch { width: 12px; height: 12px; border-radius: 3px; display: inline-block; vertical-align: middle; }
    .row-del {
      border: none; background: transparent; color: var(--muted); cursor: pointer;
      font-size: 15px; line-height: 1; padding: 2px 5px; border-radius: 5px;
    }
    .row-del:hover { background: #fde8e8; color: var(--bad); }

    /* ── 矩阵 ───────────────────────────────────────── */
    .matrix-wrap { overflow-x: auto; }
    table.matrix { border-collapse: collapse; margin: 0 auto; }
    table.matrix th, table.matrix td {
      padding: 6px 9px; text-align: center; font-size: 12px; white-space: nowrap;
      border: 1px solid var(--border);
    }
    table.matrix th { background: var(--soft); color: #4a4f70; font-weight: 600; }
    table.matrix th.corner { background: transparent; border: none; }
    table.matrix td { font-variant-numeric: tabular-nums; color: #333; }
    table.matrix td.diag { outline: 2px solid rgba(102,126,234,.5); outline-offset: -2px; }

    /* ── 单挑 ───────────────────────────────────────── */
    .duel-pick { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
    .vs { color: var(--muted); font-weight: 700; }
    .duel-grid { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: stretch; }
    .fighter {
      border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; background: #fbfcff;
    }
    .fighter.win { border-color: var(--good); background: #f1faf4; }
    .fighter h3 { margin: 0 0 8px; font-size: 13px; display: flex; align-items: center; gap: 6px; }
    .stat-line { display: flex; justify-content: space-between; font-size: 12px; padding: 2px 0; }
    .stat-line .k { color: var(--muted); }
    .stat-line .v { font-variant-numeric: tabular-nums; font-weight: 600; }
    .mid-vs { display: flex; align-items: center; justify-content: center; font-size: 20px; color: var(--muted); font-weight: 800; }
    .winner-badge {
      margin-top: 10px; text-align: center; font-size: 13px; font-weight: 700; color: var(--good);
    }
    .tag { display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 11px; font-weight: 700; }
    .tag-op { background: #fde8e8; color: var(--bad); }
    .tag-up { background: #eef0f8; color: var(--muted); }
    .tag-ok { background: #eaf7ef; color: var(--good); }

    .flags { display: flex; flex-direction: column; gap: 6px; }
    .flag-row { display: flex; align-items: center; gap: 8px; font-size: 12px; }
    .flag-row .nm { min-width: 90px; }

    /* ── 成长曲线 ───────────────────────────────────── */
    .ctrl-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
    .ctrl-row label { font-size: 12px; color: var(--muted); }
    .chart-box { background: #fbfcff; border: 1px solid var(--border); border-radius: 10px; padding: 8px; }
    svg.chart { display: block; width: 100%; height: auto; }
    .chart-axis { stroke: var(--border); stroke-width: 1; }
    .chart-grid { stroke: #eef0f6; stroke-width: 1; }
    .chart-line { fill: none; stroke: url(#gline); stroke-width: 2.5; }
    .chart-area { fill: url(#garea); opacity: .5; }
    .chart-dot { fill: var(--accent); }
    .chart-lbl { font-size: 10px; fill: var(--muted); }
    table.samples { width: 100%; border-collapse: collapse; margin-top: 4px; }
    table.samples th, table.samples td { padding: 5px 8px; font-size: 12px; text-align: right; border-bottom: 1px solid var(--border); }
    table.samples th { color: var(--muted); font-weight: 600; }
    table.samples td { font-variant-numeric: tabular-nums; }
    table.samples td.lv { text-align: left; color: var(--muted); }

    .note { font-size: 11.5px; color: var(--muted); line-height: 1.6; }
    .note b { color: var(--text); }
    .kbd { font-family: Consolas, monospace; background: var(--soft); border-radius: 4px; padding: 1px 5px; font-size: 11px; }

    /* ── 帮助浮层 ───────────────────────────────────── */
    .help-mask { position: fixed; inset: 0; background: rgba(20,22,34,.42); display: flex; align-items: center; justify-content: center; z-index: 20; }
    .help-panel { background: #fff; border-radius: 14px; max-width: 560px; width: calc(100% - 48px); max-height: 80vh; overflow: auto; padding: 22px 24px; box-shadow: 0 12px 40px rgba(0,0,0,.25); }
    .help-panel h2 { margin: 0 0 12px; font-size: 17px; }
    .help-panel h3 { margin: 16px 0 4px; font-size: 13px; color: var(--accent); }
    .help-panel p, .help-panel li { font-size: 12.5px; line-height: 1.7; color: #444; }
    .help-panel ul { margin: 4px 0; padding-left: 18px; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="vendor/vue.global.prod.js"></script>
  <script src="numeric-balance.js"></script>
</body>
</html>
