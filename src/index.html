<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'" />
  <title>工作项目列表</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <h1 class="title">工作项目列表</h1>
      <div class="stats">
        <span id="stats-text">0 项待完成</span>
      </div>
    </header>

    <div class="input-area">
      <div class="input-row">
        <input
          type="text"
          id="new-task-input"
          class="task-input"
          placeholder="添加新任务... (按 Enter 确认)"
          maxlength="200"
        />
        <select id="priority-select" class="priority-select">
          <option value="normal">普通</option>
          <option value="high">重要</option>
          <option value="low">低优</option>
        </select>
        <button id="add-btn" class="btn btn-primary">添加</button>
      </div>
    </div>

    <div class="reminder-bar">
      <div class="reminder-row">
        <span class="reminder-title">⏰ 久坐提醒</span>
        <div class="reminder-sep"></div>
        <label class="r-label">工作 <input id="r-work" type="number" class="r-num" min="1" max="180" value="25"> 分</label>
        <label class="r-label">休息 <input id="r-break" type="number" class="r-num" min="1" max="60" value="5"> 分</label>
        <select id="r-mode" class="r-mode-select">
          <option value="loop">循环</option>
          <option value="once">单次</option>
        </select>
        <div class="reminder-sep"></div>
        <div class="r-presets">
          <select id="r-preset-sel" class="r-preset-select" title="选择预设">
            <option value="" disabled selected>选择预设…</option>
          </select>
          <button id="r-preset-add" class="r-preset-btn r-preset-btn--add" title="将当前设置保存为预设">+</button>
          <button id="r-preset-del" class="r-preset-btn r-preset-btn--del" title="删除选中预设" disabled>×</button>
        </div>
        <div id="r-name-wrap" class="r-name-wrap hidden">
          <input id="r-preset-name" type="text" class="r-name-input" placeholder="输入预设名称…" maxlength="20" />
          <button id="r-name-ok"     class="r-preset-btn r-preset-btn--ok">✓</button>
          <button id="r-name-cancel" class="r-preset-btn r-preset-btn--cancel">✕</button>
        </div>
        <div class="reminder-sep"></div>
        <button id="r-toggle" class="r-btn">▶ 开始</button>
        <div id="r-display" class="r-display hidden">
          <span id="r-time" class="r-time">25:00</span>
          <span id="r-phase" class="r-phase r-phase--work">工作中</span>
        </div>
      </div>
      <div id="r-track" class="r-track hidden">
        <div id="r-fill" class="r-fill r-fill--work"></div>
      </div>
    </div>

    <div class="filter-bar">
      <button class="filter-btn active" data-filter="all">全部</button>
      <button class="filter-btn" data-filter="active">未完成</button>
      <button class="filter-btn" data-filter="in-progress">进行中</button>
      <button class="filter-btn" data-filter="completed">已完成</button>
      <div class="filter-divider"></div>
      <button id="sort-btn" class="filter-btn">优先级 ↕</button>
      <div class="spacer"></div>
      <button id="import-btn" class="btn btn-ghost-icon" title="从 JSON 文件导入">导入</button>
      <button id="export-btn" class="btn btn-ghost-icon" title="导出为 JSON 文件">导出</button>
      <button id="clear-completed-btn" class="btn btn-danger-ghost">清除已完成</button>
    </div>

    <div id="toast" class="toast hidden"></div>

    <main class="task-list-container">
      <ul id="task-list" class="task-list"></ul>
      <div id="empty-state" class="empty-state hidden">
        <div class="empty-icon">✓</div>
        <p>没有任务，享受空闲时光吧！</p>
      </div>
    </main>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
