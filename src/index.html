<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src ws: wss:" />
  <title>工作项目列表</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <h1 class="title">工作项目列表</h1>
      <div class="stats">
        <span id="stats-text">0 项待完成</span>
      </div>
    </header>

    <div class="input-area">
      <div class="input-row">
        <input
          type="text"
          id="new-task-input"
          class="task-input"
          placeholder="添加新任务... (按 Enter 确认)"
          maxlength="200"
        />
        <select id="priority-select" class="priority-select">
          <option value="normal">普通</option>
          <option value="high">重要</option>
          <option value="low">低优</option>
        </select>
        <button id="add-btn" class="btn btn-primary">添加</button>
      </div>
    </div>

    <div class="reminder-bar">
      <div class="reminder-row">
        <span class="reminder-title">⏰ 久坐提醒</span>
        <div class="reminder-sep"></div>
        <label class="r-label">工作 <input id="r-work" type="number" class="r-num" min="1" max="180" value="25"> 分</label>
        <label class="r-label">休息 <input id="r-break" type="number" class="r-num" min="1" max="60" value="5"> 分</label>
        <select id="r-mode" class="r-mode-select">
          <option value="loop">循环</option>
          <option value="once">单次</option>
        </select>
        <div class="reminder-sep"></div>
        <div class="r-presets">
          <select id="r-preset-sel" class="r-preset-select" title="选择预设">
            <option value="" disabled selected>选择预设…</option>
          </select>
          <button id="r-preset-add" class="r-preset-btn r-preset-btn--add" title="将当前设置保存为预设">+</button>
          <button id="r-preset-del" class="r-preset-btn r-preset-btn--del" title="删除选中预设" disabled>×</button>
        </div>
        <div id="r-name-wrap" class="r-name-wrap hidden">
          <input id="r-preset-name" type="text" class="r-name-input" placeholder="输入预设名称…" maxlength="20" />
          <button id="r-name-ok"     class="r-preset-btn r-preset-btn--ok">✓</button>
          <button id="r-name-cancel" class="r-preset-btn r-preset-btn--cancel">✕</button>
        </div>
        <div class="reminder-sep"></div>
        <button id="r-toggle" class="r-btn">▶ 开始</button>
        <button id="r-pause"  class="r-btn r-btn--pause hidden">⏸ 暂停</button>
        <div id="r-display" class="r-display hidden">
          <span id="r-time" class="r-time">25:00</span>
          <span id="r-phase" class="r-phase r-phase--work">工作中</span>
        </div>
      </div>
      <div id="r-track" class="r-track hidden">
        <div id="r-fill" class="r-fill r-fill--work"></div>
      </div>
    </div>

    <div class="filter-bar">
      <button class="filter-btn active" data-filter="all">全部</button>
      <button class="filter-btn" data-filter="active">未完成</button>
      <button class="filter-btn" data-filter="in-progress">进行中</button>
      <button class="filter-btn" data-filter="completed">已完成</button>
      <div class="filter-divider"></div>
      <button id="sort-btn" class="filter-btn">优先级 ↕</button>
      <div class="spacer"></div>
      <button id="text-tab-btn"  class="filter-btn">文本</button>
      <button id="group-tab-btn" class="filter-btn">工作组</button>
      <button id="draw-tab-btn"  class="filter-btn">✏ 绘图</button>
      <div class="filter-divider"></div>
      <button id="import-btn" class="btn btn-ghost-icon" title="从 JSON 文件导入">导入</button>
      <button id="export-btn" class="btn btn-ghost-icon" title="导出为 JSON 文件">导出</button>
      <button id="clear-completed-btn" class="btn btn-danger-ghost">清除已完成</button>
    </div>

    <div id="toast" class="toast hidden"></div>

    <!-- Content row: task area (left) + group sidebar (right) -->
    <div class="content-row">
      <div class="content-main">
        <main id="task-list-main" class="task-list-container">
          <ul id="task-list" class="task-list"></ul>
          <div id="empty-state" class="empty-state hidden">
            <div class="empty-icon">✓</div>
            <p>没有任务，享受空闲时光吧！</p>
          </div>
        </main>

        <div id="text-export-panel" class="text-export-panel hidden">
          <div class="text-export-toolbar">
            <span class="text-export-hint">树状文本（含状态 / 优先级 / 工作备注）</span>
            <button id="copy-text-btn" class="btn btn-ghost-icon">复制全部</button>
          </div>
          <textarea id="export-textarea" class="export-textarea" readonly spellcheck="false"></textarea>
        </div>
      </div>

      <!-- Group sidebar -->
      <div id="group-panel" class="group-panel hidden">
        <div class="group-panel-header">
          <span class="group-panel-title">👥 工作组</span>
          <span id="g-status-dot" class="g-status-dot g-status-dot--off"></span>
          <span id="g-status-text" class="g-status-text">未连接</span>
        </div>

        <div class="group-settings">
          <div class="g-field">
            <label class="g-label">我的名称</label>
            <input id="g-name" type="text" class="g-input" placeholder="输入昵称…" maxlength="20" />
          </div>
          <div class="g-field">
            <label class="g-label">服务器地址</label>
            <input id="g-url" type="text" class="g-input" placeholder="ws://192.168.1.x:8765" />
          </div>
          <button id="g-connect" class="g-connect-btn">连接</button>
        </div>

        <div class="g-divider"></div>

        <div class="g-list-header">
          在线成员
          <span id="g-user-count" class="g-user-count">0</span>
        </div>
        <ul id="g-user-list" class="g-user-list">
          <li class="g-empty">暂无成员</li>
        </ul>
      </div>
    </div>

    <!-- ══ Drawing board (replaces content-row when active) ══ -->
    <div id="draw-board" class="draw-board hidden">

      <!-- Left shape palette -->
      <div class="ds-palette">
        <div class="ds-palette-title">形状</div>

        <div class="ds-palette-item" data-shape="triangle" title="拖入画板">
          <svg viewBox="0 0 60 55" width="52" height="46">
            <polygon points="30,4 57,52 3,52" fill="#667eea"/>
          </svg>
          <span>三角形</span>
        </div>

        <div class="ds-palette-item" data-shape="circle" title="拖入画板">
          <svg viewBox="0 0 60 60" width="52" height="46">
            <ellipse cx="30" cy="30" rx="26" ry="26" fill="#52a878"/>
          </svg>
          <span>圆形</span>
        </div>

        <div class="ds-palette-item" data-shape="square" title="拖入画板">
          <svg viewBox="0 0 60 60" width="52" height="46">
            <rect x="5" y="5" width="50" height="50" rx="5" fill="#e8a020"/>
          </svg>
          <span>正方形</span>
        </div>

        <div class="ds-palette-item" data-shape="node" title="拖入画板">
          <svg viewBox="0 0 60 60" width="52" height="46">
            <circle cx="30" cy="30" r="16" fill="rgba(255,255,255,0.92)" stroke="#667eea" stroke-width="3"/>
            <circle cx="30" cy="30" r="5"  fill="#667eea"/>
          </svg>
          <span>节点</span>
        </div>

        <div class="ds-palette-item" data-shape="empty" title="拖入画板">
          <svg viewBox="0 0 60 60" width="52" height="46">
            <rect x="18" y="18" width="24" height="24" rx="3"
                  fill="rgba(102,126,234,0.06)" stroke="#9aa3c2"
                  stroke-width="2" stroke-dasharray="4 3"/>
            <circle cx="30" cy="30" r="2.8" fill="#9aa3c2"/>
          </svg>
          <span>空节点</span>
        </div>

        <div class="ds-palette-hint">拖入画板<br>Del 删除</div>
      </div>

      <!-- SVG canvas with grid -->
      <div class="ds-canvas-wrap">
        <svg id="draw-canvas" width="100%" height="100%"
             oncontextmenu="return false">
          <defs>
            <pattern id="ds-grid" width="20" height="20" patternUnits="userSpaceOnUse">
              <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#dce1ee" stroke-width="0.5"/>
            </pattern>
            <!-- Arrowhead marker -->
            <marker id="ds-arrowhead" markerWidth="8" markerHeight="6"
                    refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse">
              <polygon points="0 0, 8 3, 0 6" fill="#667eea"/>
            </marker>
            <marker id="ds-arrowhead-dim" markerWidth="8" markerHeight="6"
                    refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse">
              <polygon points="0 0, 8 3, 0 6" fill="#9aa3bf"/>
            </marker>
          </defs>
          <rect id="draw-grid-rect" width="100%" height="100%" fill="url(#ds-grid)"/>
          <g id="draw-arrows-layer"></g>
          <g id="draw-shapes-layer"></g>
        </svg>
      </div>

      <!-- Properties panel (right sidebar) -->
      <div id="ds-props-panel" class="ds-props-panel"></div>
    </div>

  </div><!-- /.app -->

  <!-- Right-click context menu (drawing board) -->
  <div id="ds-context-menu" class="ds-context-menu hidden">
    <button class="ds-ctx-item" data-action="reset">↺ 重置大小方向</button>
    <div class="ds-ctx-divider"></div>
    <button class="ds-ctx-item" data-action="layer-up">↑ 向上移动图层</button>
    <button class="ds-ctx-item" data-action="layer-down">↓ 向下移动图层</button>
    <div class="ds-ctx-divider"></div>
    <button class="ds-ctx-item" id="ds-ctx-activate" data-action="activate-connections">⚡ 激活外联连线</button>
    <div class="ds-ctx-divider"></div>
    <button class="ds-ctx-item" id="ds-ctx-group"   data-action="group">⬡ 组合为节点</button>
    <button class="ds-ctx-item" id="ds-ctx-ungroup" data-action="ungroup">⊡ 取消组合</button>
    <div class="ds-ctx-divider"></div>
    <button class="ds-ctx-item ds-ctx-item--danger" data-action="delete">✕ 删除</button>
  </div>

  <!-- User todos read-only overlay -->
  <div id="user-todos-overlay" class="user-todos-overlay hidden">
    <div class="user-todos-header">
      <button id="user-todos-back" class="user-todos-back-btn">← 返回</button>
      <span id="user-todos-name" class="user-todos-title">查看 Todo</span>
    </div>
    <div id="user-todos-content" class="user-todos-content"></div>
  </div>

  <script src="renderer.js"></script>
  <script src="draw.js"></script>
</body>
</html>
